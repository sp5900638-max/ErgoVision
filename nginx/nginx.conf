user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    # Buffer Overflow Protection
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    request_pool_size 4k;

    # Logging Format with Security Forensics
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.json json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting Zones (Memory allocated in binary zones)
    limit_req_zone $binary_remote_addr zone=global_ip_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Bad Bot & Scanner User-Agent Blacklist
    map $http_user_agent $blocked_agents {
        default 0;
        ~*(sqlmap|nikto|masscan|gobuster|wprecon|dirbuster|acunetix|nessus) 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
