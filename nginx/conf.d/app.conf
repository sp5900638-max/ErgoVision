upstream backend_upstream {
    server ergosense_backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server ergosense_frontend:8080;
    keepalive 16;
}

# Redirect Plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ergosense.yourdomain.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ergosense.yourdomain.com _;

    # --------------------------------------------------------------------------
    # SSL/TLS Hardening (A+ Configuration)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/ssl/certs/cloudflare/origin_bundle.pem;
    ssl_certificate_key /etc/ssl/certs/cloudflare/origin_private.key;

    # Restrict to TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Strict Enterprise Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    
    # Required for WebAssembly / WebGPU MediaPipe client execution
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Content Security Policy (allows Wasm execution, CDN models, and internal WebSocket)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss://$host ws://$host https://cdn.jsdelivr.net https://storage.googleapis.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Block Automated Scanners Immediately
    if ($blocked_agents) {
        return 403;
    }

    # Block access to hidden Git, environment, or configuration files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Static Frontend Assets
    # --------------------------------------------------------------------------
    location / {
        limit_conn addr_conn_limit 20;
        limit_req zone=global_ip_limit burst=50 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # REST API Routing & Rate Limiting
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=global_ip_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Sensitive Session Initialization & Calibration (Brute-Force Guard)
    location ~* ^/api/(sessions/start|calibrate|reset-session) {
        limit_req zone=auth_strict_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Real-Time WebSocket Telemetry Gateway
    # --------------------------------------------------------------------------
    location /ws/ {
        limit_conn addr_conn_limit 5;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long-lived ergonomic telemetry sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
